{% extends "base.html" %}
{% block title %}Sign In &bull; ARS Portal{% endblock %}
{% block content %}
<div class="card" style="max-width:440px; margin: 54px auto; padding:40px 34px; border:1px solid #bfdbfe; border-radius:16px; box-shadow: 0 20px 45px -10px rgba(37, 99, 235, 0.16), 0 10px 20px -8px rgba(220, 38, 38, 0.08);">
  <div style="text-align:center; margin-bottom:26px;">
    <img src="/static/img/ars-login-logo.png" alt="ARS - Audit Report Stamping" style="width:100%; max-width:330px; height:auto; display:block; margin:0 auto 12px; filter:drop-shadow(0 4px 14px rgba(37, 99, 235, 0.15));">
    <p class="muted" style="margin:0; font-size:0.86rem; font-weight:500;">Statutory Compliance &amp; Multi-Role Approval Portal</p>
  </div>

  {% if error %}
  <div class="alert alert-danger" style="margin-bottom:18px;">
    <svg class="icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
    <span>{{ error }}</span>
  </div>
  {% endif %}

  <!-- Role Quick-Select Buttons -->
  <div style="margin-bottom:22px; padding:12px; background:linear-gradient(180deg, #f0f7ff 0%, #e6f0fc 100%); border:1px solid #bfdbfe; border-radius:10px; box-shadow:inset 0 1px 3px rgba(37,99,235,0.04);">
    <span class="muted" style="font-size:0.76rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:#1e40af;">Select Role:</span>
    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:8px;">
      <button type="button" class="btn btn-secondary btn-sm role-select-btn" onclick="selectRole('cto')" id="roleBtn_cto" style="padding:10px 4px; font-size:0.80rem; flex-direction:column; gap:4px; border-color:#bfdbfe; background:#ffffff; box-shadow:0 2px 6px rgba(37,99,235,0.06);">
        <svg class="icon icon-sm" style="color:var(--brand-blue-accent);" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 1.944A11.954 11.954 0 012.166 5C2.056 5.649 2 6.319 2 7c0 5.225 3.34 9.67 8 11.317C14.66 16.67 18 12.225 18 7c0-.682-.057-1.35-.166-2.001A11.954 11.954 0 0110 1.944z" clip-rule="evenodd"/></svg>
        <span>CTO</span>
      </button>
      <button type="button" class="btn btn-secondary btn-sm role-select-btn" onclick="selectRole('accountant')" id="roleBtn_accountant" style="padding:10px 4px; font-size:0.80rem; flex-direction:column; gap:4px; border-color:#a7f3d0; background:#ffffff; box-shadow:0 2px 6px rgba(5,150,105,0.06);">
        <svg class="icon icon-sm" style="color:var(--success);" viewBox="0 0 20 20" fill="currentColor"><path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"/></svg>
        <span>Accountant</span>
      </button>
      <button type="button" class="btn btn-secondary btn-sm role-select-btn" onclick="selectRole('hr')" id="roleBtn_hr" style="padding:10px 4px; font-size:0.80rem; flex-direction:column; gap:4px; border-color:#fbcfe8; background:#ffffff; box-shadow:0 2px 6px rgba(219,39,119,0.06);">
        <svg class="icon icon-sm" style="color:#a855f7;" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/></svg>
        <span>HR</span>
      </button>
    </div>
  </div>

  <form method="post" action="/login" id="loginForm">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" placeholder="Username (e.g. cto, accountant, hr)" required autofocus autocomplete="username">

    <label for="password" style="margin-top:14px;">Password</label>
    <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">

    <div style="margin-top:22px">
      <button type="submit" class="btn btn-primary" style="width:100%; padding:11px; font-size:0.95rem;">
        <span>Sign In to Portal</span>
        <svg class="icon icon-sm" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
      </button>
    </div>
  </form>

  <div style="margin-top:24px; padding-top:16px; border-top:1px solid var(--border); text-align:center;">
    <p class="muted" style="font-size:0.80rem; margin:0;">
      Protected Enterprise System &bull; Authorized Personnel Only
    </p>
  </div>
</div>

<script>
  function selectRole(role) {
    document.getElementById('username').value = role;
    var pwdInput = document.getElementById('password');
    pwdInput.value = '';
    pwdInput.focus();

    document.querySelectorAll('.role-select-btn').forEach(function(b) {
      b.style.borderColor = 'var(--border-strong)';
      b.style.background = 'var(--bg-subtle)';
    });
    var activeBtn = document.getElementById('roleBtn_' + role);
    if (activeBtn) {
      activeBtn.style.borderColor = 'var(--brand-blue-accent)';
      activeBtn.style.background = 'rgba(37, 99, 235, 0.12)';
    }
  }
</script>
{% endblock %}
